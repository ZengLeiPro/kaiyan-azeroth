<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3155d9" />
    <title>正在更新系统 - Azeroth</title>
    <style>
      :root {
        color: #111827;
        background: #f8fafc;
        font-family:
          Inter,
          'PingFang SC',
          'Microsoft YaHei',
          system-ui,
          -apple-system,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(420px, 100%);
        padding: 40px 32px;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 16px 40px rgb(15 23 42 / 8%);
        text-align: center;
      }
      .spinner {
        width: 44px;
        height: 44px;
        margin: 0 auto 24px;
        border: 4px solid #dbe3ff;
        border-top-color: #3155d9;
        border-radius: 999px;
        animation: spin 0.8s linear infinite;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }
      p {
        min-height: 24px;
        margin: 0;
        color: #64748b;
        line-height: 1.6;
      }
      button {
        display: none;
        width: 100%;
        margin-top: 24px;
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: #3155d9;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner" aria-hidden="true"></div>
      <h1>正在更新系统</h1>
      <p id="status" role="status">正在移除旧版本缓存，请稍候…</p>
      <button id="retry" type="button">重新尝试</button>
    </main>
    <script>
      (() => {
        const status = document.getElementById('status');
        const retry = document.getElementById('retry');

        const getReturnUrl = () => {
          const hashParams = new URLSearchParams(window.location.hash.slice(1));
          const requested =
            hashParams.get('return') ?? new URLSearchParams(window.location.search).get('return');
          if (!requested || !requested.startsWith('/') || requested.startsWith('//')) return '/';
          if (requested.startsWith('/update.html')) return '/';
          return requested;
        };

        const update = async () => {
          retry.style.display = 'none';
          status.textContent = '正在移除旧版本缓存，请稍候…';

          try {
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map((registration) => registration.unregister()));
            }

            if ('caches' in window) {
              const cacheNames = await caches.keys();
              await Promise.all(cacheNames.map((name) => caches.delete(name)));
            }

            status.textContent = '更新完成，正在重新进入系统…';
            const destination = new URL(getReturnUrl(), window.location.origin);
            destination.searchParams.set('_updated', Date.now().toString());
            window.location.replace(destination.href);
          } catch (error) {
            console.error('[PWA] 清理旧版本失败', error);
            status.textContent = '自动更新失败，请检查网络后重试。';
            retry.style.display = 'block';
          }
        };

        retry.addEventListener('click', update);
        update();
      })();
    </script>
  </body>
</html>
