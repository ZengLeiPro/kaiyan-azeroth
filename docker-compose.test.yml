services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ky-azeroth-test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ky-azeroth-test']
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    image: node:22-bookworm-slim
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ky-azeroth-test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ky-azeroth-test?schema=public
      JWT_SECRET: test-jwt-secret-key-for-testing-only
      JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing-only
      CORS_ORIGIN: http://localhost:5173
      THROTTLE_LOGIN_LIMIT: '1000'
      AUTO_LEDGER_FROM_PAYMENT: 'true'
    volumes:
      - .:/workspace
      - test-node-modules:/workspace/node_modules
    command: >-
      bash -lc "corepack enable && corepack prepare pnpm@11.17.0 --activate &&
      pnpm install --frozen-lockfile && pnpm db:generate &&
      pnpm --filter @ky-azeroth/server exec prisma migrate deploy &&
      pnpm typecheck && pnpm build --concurrency=1 &&
      pnpm test --force --only --concurrency=1 &&
      pnpm --filter @ky-azeroth/server test:e2e"

volumes:
  test-node-modules:
